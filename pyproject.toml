[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1", "packaging==26.3"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "flightcheck"
version = "0.1.0"
description = "FlightCheck is a lightweight set of repository instructions that guides AI-assisted changes from request to landing."
readme = "README.md"
requires-python = ">=3.9"
license = "FSL-1.1-MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 5 - Production/Stable", "Operating System :: POSIX", "Programming Language :: Python :: 3"]

[project.urls]
Source = "https://github.com/spring-labs-inc/FlightCheck"
Issues = "https://github.com/spring-labs-inc/FlightCheck/issues"

[project.scripts]
flightcheck = "flightcheck_cli.cli:main"

[tool.setuptools]
packages = ["flightcheck_cli"]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.package-data]
flightcheck_cli = ["manifest.json", "source.tar", "source-commit.txt"]
